name: CD

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      PROJECT_NAME: "levelup-retail"
    steps:
      - uses: actions/checkout@v4

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push scanner image
        run: |
          REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-scanner"
          aws ecr create-repository --repository-name "${{ env.PROJECT_NAME }}-scanner" || true
          docker build -t scanner:latest lambdas/scanner
          docker tag scanner:latest $REPO:latest
          docker push $REPO:latest
          echo "::set-output name=scanner_image::$REPO:latest"
        id: scanner

      - name: Build & push action image
        run: |
          REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-action"
          aws ecr create-repository --repository-name "${{ env.PROJECT_NAME }}-action" || true
          docker build -t action:latest lambdas/action
          docker tag action:latest $REPO:latest
          docker push $REPO:latest
          echo "::set-output name=action_image::$REPO:latest"
        id: action

      - name: Build & push ai image
        run: |
          REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}-ai"
          aws ecr create-repository --repository-name "${{ env.PROJECT_NAME }}-ai" || true
          docker build -t ai:latest lambdas/ai_insights
          docker tag ai:latest $REPO:latest
          docker push $REPO:latest
          echo "::set-output name=ai_image::$REPO:latest"
        id: ai

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cd terraform
          terraform init -input=false

      - name: Terraform apply (staging)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform workspace select staging || terraform workspace new staging
          terraform apply -auto-approve -var="env=staging" -var="scanner_image_uri=${{ steps.scanner.outputs.scanner_image }}" -var="action_image_uri=${{ steps.action.outputs.action_image }}" -var="ai_image_uri=${{ steps.ai.outputs.ai_image }}" -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform apply (prod)
        if: github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd terraform
          terraform workspace select prod || terraform workspace new prod
          terraform apply -auto-approve -var="env=prod" -var="scanner_image_uri=${{ steps.scanner.outputs.scanner_image }}" -var="action_image_uri=${{ steps.action.outputs.action_image }}" -var="ai_image_uri=${{ steps.ai.outputs.ai_image }}" -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"
